<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@lovesskill | Witam w moim bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100 vh;
            padding: 20 px;
        }
        .container {
            text-align: center;
            max-width: 400 px;
            width: 100 %;
            background: #161616;
            padding: 35 px 20 px;
            border-radius: 20 px;
            box-shadow: 0 10 px 30 px rgba (0, 0, 0, 0.6);
            border: 1 px solid #262626;
        }
        .avatar {
            width: 250 px;
            height: 250 px;
            border-radius: 50 %;
            object-fit: cover;
            margin-bottom: 20 px;
            border: 4 px solid #333333;
            box-shadow: 0 8 px 20 px rgba (0, 0, 0, 0.4);
        }
        .handle {
            font-size: 1.5 rem;
            font-weight: 700;
            margin-bottom: 8 px;
            letter-spacing: 0.5 px;
        }
        .bio {
            font-size: 0.95 rem;
            color: #b3b3b3;
            margin-bottom: 20 px;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16 px;
            margin-bottom: 25 px;
        }
        .social-icons a {
            color: #ffffff;
            font-size: 1.5 rem;
            transition: transform 0.2 s;
        }
        .social-icons a:hover {
            transform: scale (1.15);
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12 px;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #222222;
            color: #ffffff;
            text-decoration: none;
            padding: 14 px 20 px;
            border-radius: 12 px;
            font-size: 1 rem;
            font-weight: 500;
            border: 1 px solid #333333;
            transition: all 0.2 s ease-in-out;
        }
        .link-card i {
            position: absolute;
            left: 20 px;
            font-size: 1.2 rem;
        }
        .link-card:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translateY (-2 px);
            box-shadow: 0 5 px 15 px rgba (255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="avatar.jpg" alt="@lovesskill" class="avatar">
        <h1 class="handle">@lovesskill</h1>
        <p class="bio">22 PL Młody ale uzdolniony lubie wyzwania jak i gry komputerowe :D</p>

        <div class="social-icons">
            <a href="https://www.instagram.com/_oski_oski_/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@lovesskill?lang=pl-PL" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://open.spotify.com/user/317qpx3rh73bfmlisyc53b542gfq" target="_blank"><i class="fa-brands fa-spotify"></i></a>
            <a href="https://www.snapchat.com/add/ni3znaj0my" target="_blank"><i class="fa-brands fa-snapchat"></i></a>
        </div>

        <div class="links-container">
            <a href="https://www.instagram.com/_oski_oski_/" class="link-card" target="_blank"><i class="fa-brands fa-instagram"></i> Instagram 📸</a>
            <a href="https://open.spotify.com/user/317qpx3rh73bfmlisyc53b542gfq" class="link-card" target="_blank"><i class="fa-brands fa-spotify"></i> Spotify 🎶</a>
            <a href="https://www.snapchat.com/add/ni3znaj0my" class="link-card" target="_blank"><i class="fa-brands fa-snapchat"></i> Snapchat 👻</a>
            <a href="https://www.tiktok.com/@lovesskill?lang=pl-PL" class="link-card" target="_blank"><i class="fa-brands fa-tiktok"></i> TikTok ⏰</a>
        </div>
    </div>
</body>
</html>
